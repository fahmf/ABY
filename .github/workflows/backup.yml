name: Backup database

# Jaring pengaman: project Supabase paket Free yang dibiarkan ter-pause
# berbulan-bulan tidak dijamin tersimpan selamanya. Workflow ini mengekspor
# isi database ke JSON tiap minggu dan menyimpannya sebagai artifact.
#
# Prasyarat (Settings → Secrets and variables → Actions → Secrets):
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY   (service role: ikut mencadangkan draft)
# Bila kedua secret belum diisi, workflow berhenti dengan pesan jelas
# alih-alih gagal membingungkan.

on:
  schedule:
    - cron: "30 2 * * 0" # tiap Minggu 02:30 UTC
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  export:
    name: Ekspor isi database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Periksa kredensial
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SERVICE_KEY}" ]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum diatur di repositori."
            exit 1
          fi

      - name: Jalankan pencadangan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run backup

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: aby-db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
